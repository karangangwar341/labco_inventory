name: Continuous Integration & Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/warehouse_test_db?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/warehouse_test_db?sslmode=disable"
      JWT_SECRET: "ci_test_super_secret_signing_key_32_chars_long!"
      STORAGE_DRIVER: "local"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Secret Hygiene
        run: |
          echo "Verifying no tracked .env or private key files..."
          if git ls-files | grep -E '\.env$|\.key$|\.pem$'; then
            echo "ERROR: Sensitive file committed to Git!"
            exit 1
          fi
          echo "Secret hygiene check passed."

      - name: Install Monorepo Root Dependencies
        run: npm ci || npm install

      - name: Run Backend Tests
        if: hashFiles('backend/package.json') != ''
        run: |
          cd backend
          npm ci || npm install
          npm run test --if-present

      - name: Run Frontend Tests
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm ci || npm install
          npm run test --if-present
