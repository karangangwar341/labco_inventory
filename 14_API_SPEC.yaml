openapi: 3.1.0
info:
  title: Warehouse and Client Inventory API
  version: 0.1.0
  description: Draft endpoint inventory only. Request/response schemas must be completed before implementation.
servers:
  - url: /api/v1
security:
  - sessionAuth: []
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
paths:
  /auth/login:
    post:
      security: []
      summary: Authenticate and return the profile with a small, role-scoped workspace bootstrap payload.
      description: The bootstrap payload includes approved product/unit references, permitted categories, and only locations the authenticated role can use. Lists are bounded; detailed pages continue to load their own paginated data.
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
        "423": { description: Account temporarily locked }
  /auth/logout:
    post:
      summary: Revoke current session.
      responses:
        "204": { description: Session revoked }
  /me:
    get:
      summary: Return current user role and authorized scope.
      responses:
        "200": { description: Current user }
  /me/bootstrap:
    get:
      summary: Refresh the current user's minimal role-scoped workspace bootstrap data.
      responses:
        "200": { description: Current user profile and bounded product, category, and permitted location references }
  /clients:
    get:
      summary: List clients within caller scope.
      responses:
        "200": { description: Client list }
    post:
      summary: Create a client; Super Admin only.
      responses:
        "201": { description: Client created }
  /warehouses:
    get:
      summary: List warehouses within caller scope.
      responses:
        "200": { description: Warehouse list }
    post:
      summary: Create a warehouse; Super Admin only.
      responses:
        "201": { description: Warehouse created }
  /products:
    get:
      summary: List catalog products within caller scope.
      description: Store Admin receives approved company raw materials only; Client Admin receives shared approved company products and products owned by that client; Super Admin can inspect all products.
      responses:
        "200": { description: Product list }
    post:
      summary: Create a product draft within caller's permitted catalog.
      description: Product payload includes kind: RAW_MATERIAL or MANUFACTURED_PRODUCT. Existing products default to RAW_MATERIAL; kind is immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, categoryId, quantityPrecision, allowFractional, trackingMode, units]
              properties:
                kind:
                  type: string
                  enum: [RAW_MATERIAL, MANUFACTURED_PRODUCT]
      responses:
        "201": { description: Product draft created }
  /products/manufacturing-options:
    get:
      summary: List the current client’s manufacturing choices.
      description: Client Admin only. Returns approved raw materials with a current balance or ledger history at the client, and approved manufactured products owned by the client.
      responses:
        "200": { description: Scoped rawMaterials and manufacturedProducts lists }
        "403": { description: Client Admin only }
  /production-runs:
    get:
      summary: List production runs in the caller's authorized scope.
      responses:
        "200": { description: Production runs with input and output lines }
    post:
      summary: Create a production draft; inventory is unchanged.
      responses:
        "201": { description: Production draft created }
  /production-runs/{id}:
    delete:
      summary: Delete the Client Admin caller’s own production draft.
      description: Only DRAFT runs can be deleted; submitted or approved runs are retained for review and inventory traceability.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Draft deleted; no inventory was changed }
        "403": { description: Run is outside caller’s client or submitter scope }
        "409": { description: Run is no longer a draft }
    patch:
      summary: Replace the inputs and outputs of the caller's own draft.
      description: Client Admin only; only DRAFT runs can be edited. The update is atomic and has no inventory effect.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Draft updated }
        "403": { description: Run is outside caller's client or submitter scope }
        "409": { description: Run is no longer a draft }
  /production-runs/{id}/submit:
    post:
      summary: Validate and submit a draft for Super Admin approval.
      description: Stock is unchanged until Super Admin approval posts inputs and outputs atomically.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201": { description: Run submitted for approval }
        "400": { description: Input stock or production data is invalid }
        "409": { description: Run is no longer a draft }
  /products/{id}:
    patch:
      summary: Propose a new version of an owned product; changes do not take effect before Super Admin approval.
      description: The submitted kind must match the existing product kind; type conversion requires a separate product record.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Product version submitted for approval }
        "403": { description: Outside caller's catalog scope }
        "409": { description: Duplicate product or another change is pending }
  /products/{id}/versions/{versionId}/review:
    post:
      summary: Super Admin approves or rejects a proposed product specification version.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Product version decision recorded }
        "403": { description: Super Admin only }
  /categories:
    get:
      summary: List main categories and their brand subcategories within caller scope.
      responses:
        "200": { description: Scoped category hierarchy }
    post:
      summary: Create a main category (omit parentId) or a brand subcategory (set parentId to a main category). Only one subcategory level is supported.
      responses:
        "201": { description: Category created }
  /inventory/locations:
    get:
      summary: List stock locations available within the caller's authorized scope.
      description: Client Admin responses contain only their own client location.
      responses:
        "200": { description: Authorized stock locations }
  /stock-requests:
    get:
      summary: List requests within caller scope.
      responses:
        "200": { description: Request list }
    post:
      summary: Create a stock request draft.
      responses:
        "201": { description: Draft created }
  /stock-requests/{requestId}/submit:
    post:
      summary: Validate and submit request; reserve stock when applicable.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "200": { description: Submitted }
        "409": { description: State conflict or insufficient stock }
  /stock-requests/{requestId}/approve:
    post:
      summary: Super Admin approves and atomically posts eligible request.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "200": { description: Approved and posted }
        "403": { description: Not authorized }
        "409": { description: State or stock conflict }
  /stock-requests/{requestId}/reject:
    post:
      summary: Super Admin rejects request and releases reservation.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Rejected }
  /departments/returns:
    get:
      summary: List department returns within caller scope.
      responses:
        "200": { description: Client Admin receives own-client returns; Super Admin may filter by client, department, condition, or status }
    post:
      summary: Submit a department return for Super Admin approval; submission does not change inventory.
      responses:
        "201": { description: Return request created in PENDING_APPROVAL }
        "403": { description: Caller is outside client scope or is a Store Admin }
  /departments/returns/{returnId}/approve:
    post:
      summary: Super Admin approves a return and atomically posts it to the matching condition balance.
      parameters:
        - in: path
          name: returnId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
      responses:
        "200": { description: Approved and posted }
        "403": { description: Super Admin only }
        "409": { description: Return is no longer pending }
  /departments/returns/{returnId}/reject:
    post:
      summary: Super Admin rejects a pending return with a required reason.
      parameters:
        - in: path
          name: returnId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Rejected; inventory unchanged }
        "403": { description: Super Admin only }
  /departments/write-offs:
    post:
      summary: Super Admin posts a reasoned, idempotent write-off from a client's damaged or expired balance.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
      responses:
        "201": { description: Write-off adjustment posted }
        "403": { description: Super Admin only }
        "409": { description: Insufficient damaged or expired stock }
  /departments/issues/draft:
    post:
      summary: Get or create the Client Admin's single open daily department issue draft for their client.
      responses:
        "200": { description: Existing editable draft }
        "201": { description: New editable draft }
        "403": { description: Client Admin only }
  /departments/issues/batches:
    get:
      summary: List department issue batches, scoped to the caller's client where applicable.
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, POSTED, REJECTED] }
      responses:
        "200": { description: Scoped issue batches }
  /departments/issues/batches/{id}/lines:
    patch:
      summary: Replace a Client Admin's draft issue lines. Revalidates all replacement lines; no stock is changed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Saved daily draft }
        "409": { description: Draft is no longer editable }
  /departments/issues/batches/{id}/submit:
    post:
      summary: Revalidate and submit the entire daily draft; reserves all lines or posts all lines per current approval policy.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Batch pending approval or immediately posted }
        "400": { description: Invalid line or insufficient stock; no partial submission }
  /departments/issues/batches/{id}/approve:
    post:
      summary: Super Admin approves every line and posts the batch atomically.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Approved and posted batch }
        "403": { description: Super Admin only }
  /departments/issues/batches/{id}/reject:
    post:
      summary: Super Admin rejects the complete batch and releases all reservations.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Rejected batch }
        "403": { description: Super Admin only }
  /import-batches:
    post:
      summary: Create a private import draft; must not post inventory.
      responses:
        "201": { description: Import draft created }
  /import-batches/{batchId}/validate:
    post:
      summary: Validate imported draft rows.
      parameters:
        - in: path
          name: batchId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Validation results }
  /reports/{reportType}:
    get:
      summary: Generate an authorized report; Super Admin may scope client reports with clientId.
      parameters:
        - in: path
          name: reportType
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Report output. STOCK_BALANCE rows include the product baseUnit. PRODUCTION_RUNS rows include plannedOutput, actualOutput,
            wastage, and inputs and outputs arrays containing product name, quantity,
            and unit snapshots. Client-scoped report data remains restricted to the
            requested client by server-side location and ownership filters.
  /notifications/settings:
    get:
      summary: Read notification and approval settings; approval requirements default to true when unset.
      responses:
        "200": { description: Current global system settings including per-workflow approval requirements }
    patch:
      summary: Super Admin updates global notification, expiry, receipt, and approval settings. Only new submissions use changed approval rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalRequirements:
                  type: object
                  additionalProperties: false
                  description: Partial boolean map for stockRequests, shipmentReceipt, manufacturing, departmentIssue, departmentReturn, and imports.
      responses:
        "200": { description: Updated settings; change is audited }
        "400": { description: Unknown workflow or invalid setting value }
        "403": { description: Super Admin only }
