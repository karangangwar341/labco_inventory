openapi: 3.1.0
info:
  title: Warehouse and Project Inventory API
  version: 0.1.0
  description: Draft endpoint inventory only. Request/response schemas must be completed before implementation.
servers:
  - url: /api/v1
security:
  - sessionAuth: []
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
paths:
  /auth/login:
    post:
      security: []
      summary: Authenticate and return the profile with a small, role-scoped workspace bootstrap payload.
      description: The bootstrap payload includes approved product/unit references, permitted categories, and only locations the authenticated role can use. Lists are bounded; detailed pages continue to load their own paginated data.
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
        "423": { description: Account temporarily locked }
  /auth/logout:
    post:
      summary: Revoke current session.
      responses:
        "204": { description: Session revoked }
  /me:
    get:
      summary: Return current user role and authorized scope.
      responses:
        "200": { description: Current user }
  /me/bootstrap:
    get:
      summary: Refresh the current user's minimal role-scoped workspace bootstrap data.
      responses:
        "200": { description: Current user profile and bounded product, category, and permitted location references }
  /projects:
    get:
      summary: List projects within caller scope.
      responses:
        "200": { description: Project list }
    post:
      summary: Create a project; Super Admin only.
      responses:
        "201": { description: Project created }
  /warehouses:
    get:
      summary: List warehouses within caller scope (Super Admin sees all; Store Admin sees all assigned warehouses).
      responses:
        "200": { description: Warehouse list }
    post:
      summary: Create a warehouse; Super Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                locationDescription: { type: string }
                storeAdminId: { type: string, format: uuid, nullable: true }
      responses:
        "201": { description: Warehouse created }
  /warehouses/{id}:
    put:
      summary: Update warehouse details and assign/reassign Store Admin; Super Admin only.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                locationDescription: { type: string }
                storeAdminId: { type: string, format: uuid, nullable: true }
      responses:
        "200": { description: Warehouse updated }
        "403": { description: Super Admin only }
  /products:
    get:
      summary: List catalog products within caller scope.
      description: Store Admin receives approved company raw materials only; Project Admin receives shared approved company products and products owned by that project; Super Admin can inspect all products.
      responses:
        "200": { description: Product list }
    post:
      summary: Create a product draft within caller's permitted catalog.
      description: Product payload includes kind: RAW_MATERIAL or MANUFACTURED_PRODUCT. Existing products default to RAW_MATERIAL; kind is immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, categoryId, quantityPrecision, allowFractional, units]
              properties:
                kind:
                  type: string
                  enum: [RAW_MATERIAL, MANUFACTURED_PRODUCT]
      responses:
        "201": { description: Product draft created }
  /products/manufacturing-options:
    get:
      summary: List the current project’s manufacturing choices.
      description: Project Admin only. Returns approved raw materials with a current balance or ledger history at the project, and approved manufactured products owned by the project.
      responses:
        "200": { description: Scoped rawMaterials and manufacturedProducts lists }
        "403": { description: Project Admin only }
  /production-runs:
    get:
      summary: List production runs in the caller's authorized scope.
      responses:
        "200": { description: Production runs with input and output lines }
    post:
      summary: Create a production draft; inventory is unchanged.
      responses:
        "201": { description: Production draft created }
  /production-runs/{id}:
    delete:
      summary: Delete the Project Admin caller’s own production draft.
      description: Only DRAFT runs can be deleted; submitted or approved runs are retained for review and inventory traceability.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Draft deleted; no inventory was changed }
        "403": { description: Run is outside caller’s project or submitter scope }
        "409": { description: Run is no longer a draft }
    patch:
      summary: Replace the inputs and outputs of the caller's own draft.
      description: Project Admin only; only DRAFT runs can be edited. The update is atomic and has no inventory effect.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Draft updated }
        "403": { description: Run is outside caller's project or submitter scope }
        "409": { description: Run is no longer a draft }
  /production-runs/{id}/submit:
    post:
      summary: Validate and submit a draft for Super Admin approval.
      description: Stock is unchanged until Super Admin approval posts inputs and outputs atomically.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201": { description: Run submitted for approval }
        "400": { description: Input stock or production data is invalid }
        "409": { description: Run is no longer a draft }
  /products/{id}:
    patch:
      summary: Propose a new version of an owned product; changes do not take effect before Super Admin approval.
      description: The submitted kind must match the existing product kind; type conversion requires a separate product record.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Product version submitted for approval }
        "403": { description: Outside caller's catalog scope }
        "409": { description: Duplicate product or another change is pending }
  /products/{id}/versions/{versionId}/review:
    post:
      summary: Super Admin approves or rejects a proposed product specification version.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: versionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Product version decision recorded }
        "403": { description: Super Admin only }
  /categories:
    get:
      summary: List main categories and their brand subcategories within caller scope.
      responses:
        "200": { description: Scoped category hierarchy }
    post:
      summary: Create a main category (omit parentId) or a brand subcategory (set parentId to a main category). Only one subcategory level is supported.
      responses:
        "201": { description: Category created }
  /units:
    get:
      summary: List standard measurement units, category classifications, and real-time product usage statistics.
      responses:
        "200": { description: List of standard units with catalog product usage count }
    post:
      summary: Create a standard measurement unit template (Super Admin only).
      responses:
        "201": { description: Standard unit template created }
        "403": { description: Super Admin only }
        "409": { description: Unit name already exists }
  /units/{name}:
    delete:
      summary: Remove a custom unit template or hide a built-in standard unit template (Super Admin only).
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200": { description: Unit template removed }
        "403": { description: Super Admin only }
        "404": { description: Unit not found }
  /inventory/locations:
    get:
      summary: List stock locations available within the caller's authorized scope.
      description: Project Admin responses contain only their own project location.
      responses:
        "200": { description: Authorized stock locations }
  /stock-requests:
    get:
      summary: List requests within caller scope.
      responses:
        "200": { description: Request list }
    post:
      summary: Create a stock request draft.
      responses:
        "201": { description: Draft created }
  /stock-requests/{requestId}/submit:
    post:
      summary: Validate and submit request; reserve stock when applicable.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "200": { description: Submitted }
        "409": { description: State conflict or insufficient stock }
  /stock-requests/{requestId}/approve:
    post:
      summary: Super Admin approves and atomically posts eligible request.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "200": { description: Approved and posted }
        "403": { description: Not authorized }
        "409": { description: State or stock conflict }
  /stock-requests/{requestId}/reject:
    post:
      summary: Super Admin rejects request and releases reservation.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Rejected }
  /departments/returns:
    get:
      summary: List department returns within caller scope.
      responses:
        "200": { description: Project Admin receives own-project returns; Super Admin may filter by project, department, or status }
    post:
      summary: Submit a department return for Super Admin approval; submission does not change inventory.
      responses:
        "201": { description: Return request created in PENDING_APPROVAL }
        "403": { description: Caller is outside project scope or is a Store Admin }
  /departments/returns/{returnId}/approve:
    post:
      summary: Super Admin approves a usable return and atomically restores usable stock.
      parameters:
        - in: path
          name: returnId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string }
      responses:
        "200": { description: Approved and posted }
        "403": { description: Super Admin only }
        "409": { description: Return is no longer pending }
  /departments/returns/{returnId}/reject:
    post:
      summary: Super Admin rejects a pending return with a required reason.
      parameters:
        - in: path
          name: returnId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Rejected; inventory unchanged }
        "403": { description: Super Admin only }
  /departments/issues/draft:
    post:
      summary: Get or create the Project Admin's single open daily department issue draft for their project.
      responses:
        "200": { description: Existing editable draft }
        "201": { description: New editable draft }
        "403": { description: Project Admin only }
  /departments/issues/batches:
    get:
      summary: List project stock-out batches, scoped to the caller's project where applicable.
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, POSTED, REJECTED] }
      responses:
        "200": { description: Scoped issue batches }
  /departments/issues:
    post:
      summary: Record department issue line tracking physical indentNumber and requestedQuantity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId, productId, quantity]
              properties:
                departmentId: { type: string, format: uuid }
                productId: { type: string, format: uuid }
                quantity: { type: number, description: "Supplied quantity drawn from usable stock" }
                requestedQuantity: { type: number, description: "Requested quantity on physical indent form" }
                indentNumber: { type: string, description: "Physical indent form tracking number" }
                notes: { type: string }
      responses:
        "201": { description: Issue created or added to daily draft }
  /departments/issues/batches/{id}/lines:
    patch:
      summary: Replace a Project Admin's draft stock-out lines. Each line names an active department, an approved product, physical indentNumber, and requestedQuantity vs supplied quantity. Revalidates all lines; no stock is changed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Saved daily draft }
        "409": { description: Draft is no longer editable }
  /departments/issues/batches/{id}/submit:
    post:
      summary: Revalidate and submit the entire daily draft; reserves all lines or posts all lines per current approval policy.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Batch pending approval or immediately posted }
        "400": { description: Invalid line or insufficient stock; no partial submission }
  /departments/issues/batches/{id}/approve:
    post:
      summary: Super Admin approves every line and posts the batch atomically.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Approved and posted batch }
        "403": { description: Super Admin only }
  /departments/issues/batches/{id}/reject:
    post:
      summary: Super Admin rejects the complete batch and releases all reservations.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Rejected batch }
        "403": { description: Super Admin only }
  /import-batches:
    post:
      summary: Create a private import draft from Excel (.xlsx/.xls) or CSV; must not post inventory or mutate catalog directly.
      description: Supports import types STOCK_IN, STOCK_OUT, and PRODUCT_CATALOG (bulk creation of products, main categories, subcategories, and base units).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importType, sourceFilename, fileContent]
              properties:
                importType: { type: string, enum: [STOCK_IN, STOCK_OUT, PRODUCT_CATALOG] }
                sourceFilename: { type: string }
                fileContent: { type: string, description: "Raw CSV/JSON text or base64 Excel data URL" }
                mimeType: { type: string }
                defaultLocationId: { type: string, format: uuid, nullable: true }
                approvalMode: { type: string, enum: [ALL_OR_NOTHING, PARTIAL], default: PARTIAL }
      responses:
        "201": { description: Import draft created }
  /import-batches/{batchId}/validate:
    post:
      summary: Validate imported draft rows.
      parameters:
        - in: path
          name: batchId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Validation results }
  /shipments/{id}/resolve-discrepancy:
    post:
      summary: Super Admin resolves every shortage line on a held shipment with one final decision.
      description: MISSING records an audited loss; CALCULATION_MISTAKE posts the quantity back to the source warehouse. The decision is one-time and idempotent.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolution]
              properties:
                resolution: { type: string, enum: [MISSING, CALCULATION_MISTAKE] }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: Shipment discrepancy resolved and audited }
        "403": { description: Super Admin only }
        "409": { description: Shipment is not held or was already resolved }
  /reports/{reportType}:
    get:
      summary: Generate an authorized report; Super Admin may scope project reports with projectId. MISSING_STOCK is Super Admin only and groups missing quantities by product in base units.
      parameters:
        - in: path
          name: reportType
          required: true
          schema: { type: string, enum: [STOCK_BALANCE, INVENTORY_LEDGER, PROJECT_CONSUMPTION, PRODUCTION_RUNS, SHIPMENTS, MISSING_STOCK] }
      responses:
        "200":
          description: >-
            Report output. STOCK_BALANCE rows include the product baseUnit. PRODUCTION_RUNS rows include plannedOutput, actualOutput,
            wastage, and inputs and outputs arrays containing product name, quantity,
            and unit snapshots. Project-scoped report data remains restricted to the
            requested project by server-side location and ownership filters.
  /notifications/settings:
    get:
      summary: Read notification and approval settings; approval requirements default to true when unset.
      responses:
        "200": { description: Current global system settings including per-workflow approval requirements }
    patch:
      summary: Super Admin updates global notification, receipt, and approval settings. Only new submissions use changed approval rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalRequirements:
                  type: object
                  additionalProperties: false
                  description: Partial boolean map for stockRequests, shipmentReceipt, manufacturing, departmentIssue, departmentReturn, and imports.
      responses:
        "200": { description: Updated settings; change is audited }
        "400": { description: Unknown workflow or invalid setting value }
        "403": { description: Super Admin only }
